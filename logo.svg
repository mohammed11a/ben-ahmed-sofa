<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>
  
  <!-- Background with rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="500" height="500" x="6" y="6" rx="106" fill="none" stroke="url(#gold)" stroke-width="3" stroke-opacity="0.3" />

  <!-- Sofa Icon Elements -->
  <g transform="translate(56, 120)" filter="url(#shadow)">
    <!-- Sofa Backrest -->
    <path d="M40 140 C40 60, 80 40, 200 40 C320 40, 360 60, 360 140 Z" fill="url(#gold)" />
    
    <!-- Deep Button Tufting accents (Chesterfield style) -->
    <circle cx="120" cy="85" r="5" fill="#78350f" opacity="0.6"/>
    <circle cx="160" cy="70" r="5" fill="#78350f" opacity="0.6"/>
    <circle cx="200" cy="85" r="5" fill="#78350f" opacity="0.6"/>
    <circle cx="240" cy="70" r="5" fill="#78350f" opacity="0.6"/>
    <circle cx="280" cy="85" r="5" fill="#78350f" opacity="0.6"/>
    
    <!-- Armrests -->
    <rect x="20" y="100" width="55" height="120" rx="26" fill="#f59e0b" stroke="#fbbf24" stroke-width="2" />
    <rect x="325" y="100" width="55" height="120" rx="26" fill="#f59e0b" stroke="#fbbf24" stroke-width="2" />
    
    <!-- Cushions / Seats -->
    <rect x="65" y="130" width="130" height="85" rx="16" fill="#fef3c7" stroke="#fbbf24" stroke-width="3" />
    <rect x="205" y="130" width="130" height="85" rx="16" fill="#fef3c7" stroke="#fbbf24" stroke-width="3" />
    
    <!-- Sofa Base Frame -->
    <rect x="35" y="210" width="330" height="30" rx="10" fill="#b45309" />
    
    <!-- Legs -->
    <polygon points="50,240 65,240 55,275 42,275" fill="#78350f" />
    <polygon points="350,240 335,240 345,275 358,275" fill="#78350f" />
    <polygon points="195,240 205,240 203,275 197,275" fill="#78350f" />
  </g>

  <!-- Typography: بن أحمد -->
  <text x="256" y="445" font-family="'Cairo', sans-serif" font-size="44" font-weight="800" text-anchor="middle" fill="#f8fafc" letter-spacing="2">
    بن أحمد للكنب
  </text>
  <text x="256" y="480" font-family="'Cairo', sans-serif" font-size="20" font-weight="600" text-anchor="middle" fill="#fbbf24" opacity="0.9">
    نظام إدارة وتفصيل الطلبات
  </text>
</svg>
